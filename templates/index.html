<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Repo Analyzer</title>
<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --border: #334155;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --accent: #10b981;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
.container { max-width: 1300px; margin: 0 auto; }
header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 1.8rem; font-weight: 700; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
input, select, button { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; }
input:focus, select:focus { outline: none; border-color: var(--primary); }
button.btn-primary { background: var(--primary); border: none; font-weight: 600; cursor: pointer; color: white; transition: background 0.2s; }
button.btn-primary:hover { background: var(--primary-hover); }
button.btn-secondary { background: transparent; border: 1px solid var(--border); cursor: pointer; color: var(--text); }
button.btn-secondary:hover { background: #334155; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { background: #182232; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
.score-badge { display: inline-block; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-align: center; font-size: 0.9rem; }
.score-high { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
.score-med { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
.score-low { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
.tag { display: inline-block; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 4px; margin-bottom: 4px; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; width: 90%; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
.pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.pro-box { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--accent); padding: 12px; }
.con-box { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); padding: 12px; }
.readme-container { background: #0f172a; padding: 16px; border-radius: 6px; margin-top: 16px; border: 1px solid var(--border); max-height: 300px; overflow-y: auto; font-size: 0.85rem; }
.controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>GitHub Repo Analyzer</h1>
<div>
<button class="btn-secondary" onclick="openBookmarksModal()">Bookmarks (<span id="bookmark-count">0</span>)</button>
</div>
</header>

<div class="card">
<form id="search-form" class="form-grid">
<div class="form-group">
<label>Search Query</label>
<input type="text" name="query" placeholder="e.g. audio midi transcription" value="audio midi transcription" required>
</div>
<div class="form-group">
<label>Your Goal / Specific Requirements</label>
<input type="text" name="goal" placeholder="e.g. quantization control" value="quantization control">
</div>
<div class="form-group">
<label>Language</label>
<input type="text" name="language" placeholder="Python, C++...">
</div>
<div class="form-group">
<label>Min Stars</label>
<input type="number" name="min_stars" value="10" min="0">
</div>
<div class="form-group">
<label>Max Results</label>
<select name="max_results">
<option value="3">3 repos</option>
<option value="5" selected>5 repos</option>
<option value="10">10 repos</option>
</select>
</div>
<button type="submit" class="btn-primary">Scan Repos</button>
</form>
</div>

<!-- History Bar -->
<div id="history-section" style="display: none; margin-bottom: 20px;">
<div class="card" style="padding: 12px 16px;">
<h3 style="font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted);">Recent Searches:</h3>
<div id="history-list" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
</div>
</div>

<!-- Loading Progress Bar -->
<div id="loading" style="display: none; text-align: center; padding: 40px;">
<div style="width: 300px; height: 8px; background: #1e293b; border-radius: 4px; margin: 0 auto 16px; overflow: hidden;">
<div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 4px; transition: width 0.3s ease;"></div>
</div>
<div id="progress-text" style="color: var(--text-muted); font-size: 0.9rem;">Initializing search...</div>
<div id="progress-eta" style="color: var(--text-muted); font-size: 0.8rem; margin-top: 6px;"></div>
</div>

<!-- Results Section -->
<div id="results-section" style="display: none;">
<div class="controls-bar">
<div style="display: flex; align-items: center; gap: 12px;">
<h2 id="results-count">Results</h2>
<button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="exportResults()">📥 Export CSV</button>
</div>
<form id="compare-form" action="/compare" method="POST" target="_blank">
<input type="hidden" name="repos_data" id="compare-data-input">
<button type="button" class="btn-primary" onclick="submitCompare()">Compare Selected (<span id="selected-count">0</span>)</button>
</form>
</div>
<div class="card" style="padding: 0; overflow-x: auto;">
<table>
<thead>
<tr>
<th style="width: 40px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
<th>Repo</th>
<th>Stars</th>
<th>Score</th>
<th>Setup</th>
<th>Tech Stack</th>
<th>Last Updated</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="results-table-body"></tbody>
</table>
</div>
</div>
</div>

<!-- Modals -->
<div id="deep-dive-modal" class="modal">
<div class="modal-content">
<div class="modal-header">
<h3 id="modal-repo-name">Repo Name</h3>
<button class="close-btn" onclick="closeModal('deep-dive-modal')">&times;</button>
</div>
<div class="modal-body" id="modal-body-content"></div>
</div>
</div>

<div id="bookmarks-modal" class="modal">
<div class="modal-content">
<div class="modal-header">
<h3>Bookmarked Repositories</h3>
<button class="close-btn" onclick="closeModal('bookmarks-modal')">&times;</button>
</div>
<div class="modal-body">
<table style="width:100%;">
<thead>
<tr>
<th>Repo</th>
<th>Stars</th>
<th>Score</th>
<th>Difficulty</th>
<th>Notes (Click to Edit)</th>
<th>Action</th>
</tr>
</thead>
<tbody id="bookmarks-table-body"></tbody>
</table>
</div>
</div>
</div>

<script>
let currentResults = [];

// Escapes untrusted text before it is inserted into innerHTML template strings.
// Anything coming from GitHub (descriptions, names) or the AI (summaries, pros/cons,
// recommendations) must be passed through this before being interpolated.
function escapeHtml(str) {
  if (str == null) return "";
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

const SECONDS_PER_REPO = 9; // calibrate this later if it's consistently off

document.getElementById('search-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const maxResults = parseInt(formData.get('max_results')) || 5;
  const estimatedSeconds = maxResults * SECONDS_PER_REPO;

  document.getElementById('loading').style.display = 'block';
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('progress-bar').style.width = '5%';
  document.getElementById('progress-text').innerText = 'Querying GitHub API...';

  const startTime = Date.now();
  let progressInterval;

  function updateProgress() {
    const elapsed = (Date.now() - startTime) / 1000;
    const remaining = Math.max(0, Math.ceil(estimatedSeconds - elapsed));
    // Cap displayed progress at 90% until the real response arrives
    const pct = Math.min(90, (elapsed / estimatedSeconds) * 90);
    document.getElementById('progress-bar').style.width = pct + '%';

    if (elapsed < 1.5) {
      document.getElementById('progress-text').innerText = 'Querying GitHub API...';
    } else {
      document.getElementById('progress-text').innerText = `Analyzing repositories (${maxResults} total)...`;
    }

    document.getElementById('progress-eta').innerText =
      remaining > 0 ? `Estimated time remaining: ~${remaining}s` : 'Almost done...';
  }

  updateProgress();
  progressInterval = setInterval(updateProgress, 500);

  try {
    const response = await fetch('/search', { method: 'POST', body: formData });
    const data = await response.json();

    clearInterval(progressInterval);
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('progress-eta').innerText = '';

    if (response.ok) {
      currentResults = data.results;
      renderResults(data.results);
      loadHistory();
    } else {
      alert('Error: ' + (data.error || 'Failed to fetch repositories'));
    }
  } catch (err) {
    clearInterval(progressInterval);
    alert('Network error occurred.');
  } finally {
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 400);
  }
});

function renderResults(results) {
  const tbody = document.getElementById('results-table-body');
  tbody.innerHTML = '';
  document.getElementById('results-count').innerText = `Scanned ${results.length} Repositories`;

  results.forEach((repo, index) => {
    const score = repo.analysis.relevance_score;
    let scoreClass = 'score-low';
    if (score >= 8) scoreClass = 'score-high';
    else if (score >= 5) scoreClass = 'score-med';

    const stackTags = (repo.analysis.tech_stack || [])
      .map(t => `<span class="tag">${escapeHtml(t)}</span>`)
      .join('');

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox" class="repo-select" value="${index}" onchange="updateSelectedCount()"></td>
      <td>
        <a href="${escapeHtml(repo.url)}" target="_blank" style="color: var(--primary); font-weight:600; text-decoration:none;">${escapeHtml(repo.full_name)}</a>
        <div style="font-size:0.8rem; color:var(--text-muted); overflow: hidden; max-width: 300px;">${escapeHtml(repo.description)}</div>
      </td>
      <td>★ ${repo.stars.toLocaleString()}</td>
      <td><span class="score-badge ${scoreClass}">${score}/10</span></td>
      <td>${escapeHtml(repo.analysis.setup_difficulty)}</td>
      <td>${stackTags}</td>
      <td style="font-size:0.85rem; color:var(--text-muted);">${escapeHtml(repo.last_updated)}</td>
      <td>
        <button class="btn-secondary" style="padding: 4px 8px; font-size:0.8rem;" onclick="openDeepDive(${index})">Inspect</button>
        <button class="btn-secondary" style="padding: 4px 8px; font-size:0.8rem;" onclick="bookmarkRepo(${index})">★ Bookmark</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('results-section').style.display = 'block';
  updateSelectedCount();
  fetchBookmarkCount();
}

function openDeepDive(index) {
  const repo = currentResults[index];
  document.getElementById('modal-repo-name').innerText = repo.full_name; // innerText is safe, no escaping needed
  const analysis = repo.analysis;

  const pros = (analysis.pros || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
  const cons = (analysis.cons || []).map(c => `<li>${escapeHtml(c)}</li>`).join('');

  document.getElementById('modal-body-content').innerHTML = `
    <div style="margin-bottom:16px;">
      <span class="score-badge ${analysis.relevance_score >= 8 ? 'score-high' : 'score-med'}">Overall Score: ${analysis.relevance_score}/10</span>
      <span style="margin-left: 12px; color: var(--text-muted);">Setup: <strong>${escapeHtml(analysis.setup_difficulty)}</strong></span>
    </div>
    <div style="display:flex; gap:16px; margin-bottom:16px; font-size:0.85rem; color: var(--text-muted);">
      <div>🎯 Goal Match: <strong style="color:var(--text);">${analysis.goal_match_score ?? '-'}/10</strong></div>
      <div>🔧 Maintenance: <strong style="color:var(--text);">${analysis.maintenance_score ?? '-'}/10</strong></div>
      <div>👥 Community: <strong style="color:var(--text);">${analysis.community_score ?? '-'}/10</strong></div>
    </div>
    <p><strong>Goal Assessment:</strong> ${escapeHtml(analysis.match_summary)}</p>
    <div class="pro-con-grid">
      <div class="pro-box"><strong style="color: var(--accent);">Pros</strong><ul style="margin-left: 16px; margin-top: 6px;">${pros}</ul></div>
      <div class="con-box"><strong style="color: var(--danger);">Cons</strong><ul style="margin-left: 16px; margin-top: 6px;">${cons}</ul></div>
    </div>
    <div style="background: #182232; padding: 12px; border-radius: 6px; margin-bottom: 16px;"><strong>Recommendation:</strong> ${escapeHtml(analysis.recommendation)}</div>
    <h4>README Summary & Preview</h4>
    <div class="readme-container">${repo.readme_html}</div>
  `;
  // Note: repo.readme_html is intentionally NOT escaped here. It is sanitized
  // server-side with bleach before it ever reaches the client, so it is safe
  // to render as HTML and needs to keep its tags (headings, links, code blocks, etc).

  document.getElementById('deep-dive-modal').style.display = 'flex';
}

function updateSelectedCount() {
  const selected = document.querySelectorAll('.repo-select:checked');
  document.getElementById('selected-count').innerText = selected.length;
}

function toggleSelectAll(master) {
  document.querySelectorAll('.repo-select').forEach(cb => cb.checked = master.checked);
  updateSelectedCount();
}

function submitCompare() {
  const selectedIndexes = Array.from(document.querySelectorAll('.repo-select:checked')).map(cb => parseInt(cb.value));
  if (selectedIndexes.length < 2) {
    alert('Please select at least 2 repositories to compare.');
    return;
  }
  const selectedData = selectedIndexes.map(i => currentResults[i]);
  document.getElementById('compare-data-input').value = JSON.stringify(selectedData);
  document.getElementById('compare-form').submit();
}

async function exportResults() {
  if (currentResults.length === 0) return;
  const resp = await fetch('/export', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ results: currentResults })
  });
  if (resp.ok) {
    const blob = await resp.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'github_repos_analysis.csv';
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
  }
}

async function bookmarkRepo(index) {
  const repo = currentResults[index];
  const notes = prompt("Add personal note for this bookmark (optional):", "");
  const payload = {
    full_name: repo.full_name,
    stars: repo.stars,
    relevance_score: repo.analysis.relevance_score,
    summary: repo.analysis.match_summary,
    tech_stack: repo.analysis.tech_stack,
    setup_difficulty: repo.analysis.setup_difficulty,
    url: repo.url,
    notes: notes || ""
  };
  const resp = await fetch('/api/bookmarks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (resp.ok) {
    alert("Bookmarked!");
    fetchBookmarkCount();
  } else {
    alert("Repository is already bookmarked.");
  }
}

async function fetchBookmarkCount() {
  const resp = await fetch('/api/bookmarks');
  const data = await resp.json();
  document.getElementById('bookmark-count').innerText = data.length;
}

async function openBookmarksModal() {
  const resp = await fetch('/api/bookmarks');
  const bookmarks = await resp.json();
  const tbody = document.getElementById('bookmarks-table-body');
  tbody.innerHTML = '';

  bookmarks.forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a href="${escapeHtml(b.url)}" target="_blank" style="color:var(--primary);">${escapeHtml(b.repo_full_name)}</a></td>
      <td>★ ${b.stars}</td>
      <td>${b.relevance_score}/10</td>
      <td>${escapeHtml(b.setup_difficulty)}</td>
      <td>
        <div contenteditable="true"
          onblur="updateBookmarkNote('${encodeURIComponent(b.repo_full_name)}', this.innerText)"
          style="font-size:0.85rem; color:var(--text-muted); min-height: 20px; padding: 4px; border: 1px solid var(--border); border-radius: 4px;"
          onfocus="this.style.borderColor='var(--primary)'"
        >${escapeHtml(b.notes || '-')}</div>
      </td>
      <td><button class="btn-secondary" style="color:var(--danger);" onclick="deleteBookmark('${encodeURIComponent(b.repo_full_name)}')">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('bookmarks-modal').style.display = 'flex';
}

async function updateBookmarkNote(encodedFullName, notes) {
  await fetch(`/api/bookmarks/${encodedFullName}/notes`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ notes: notes.trim() })
  });
}

async function deleteBookmark(encodedFullName) {
  await fetch(`/api/bookmarks/${encodedFullName}`, { method: 'DELETE' });
  openBookmarksModal();
  fetchBookmarkCount();
}

async function loadHistory() {
  try {
    const resp = await fetch('/api/history');
    const history = await resp.json();
    if (history.length > 0) {
      const container = document.getElementById('history-list');
      container.innerHTML = '';
      history.forEach(h => {
        const chip = document.createElement('button');
        chip.className = 'btn-secondary';
        chip.style.cssText = 'padding: 4px 10px; font-size: 0.8rem;';
        chip.innerHTML = `🔍 ${escapeHtml(h.query)} <span style="color:var(--text-muted);">(${h.result_count})</span>`;
        chip.onclick = () => {
          document.querySelector('input[name="query"]').value = h.query;
          document.querySelector('input[name="goal"]').value = h.goal || '';
          document.querySelector('input[name="language"]').value = h.language || '';
          document.querySelector('input[name="min_stars"]').value = h.min_stars || 0;
        };
        container.appendChild(chip);
      });
      document.getElementById('history-section').style.display = 'block';
    }
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

fetchBookmarkCount();
loadHistory();
</script>
</body>
</html>
